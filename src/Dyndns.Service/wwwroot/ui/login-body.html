<form class="auth-form" id="loginForm">
  <div class="field">
    <label for="password">Password</label>
    <input
      id="password"
      name="password"
      type="password"
      autocomplete="current-password"
      required
    />
  </div>
  <button class="primary" type="submit">Sign in</button>
  <div class="feedback" id="feedback">{{ERROR_MESSAGE}}</div>
</form>
